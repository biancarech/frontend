<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .site {
            width: 700px;
            background-color: white;

            padding: 25px;

            border-radius: 12px;
            box-shadow: 0px 4px 15px #999;
        }

        h1 {
            text-align: center;
            color: #282421;
            margin-bottom: 25px;
        }

        fieldset {
            border: 2px solid #72675c;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
        }

        legend {
            color: #7a4d2b;
            font-weight: bold;
            padding: 0 10px;
        }

        .linha1,
        .linha2,
        .linha3,
        .linha4,
        .linha5,
        .linha6,
        .linha7,
        .linha8,
        .linha9 {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            color: #232020;
            font-size: 14px;

            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input,
        select,
        textarea {
            padding: 8px;
            border: 1px solid #5d3c3c;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #776a60;
        }

        input {
            min-width: 150px;
        }

        textarea {
            width: 100%;
            height: 80px;
            resize: none;
        }

        .botoes {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            background-color: #674226;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #68574b;
        }

    </style>
</head>

<body>

    <div class="site">

        <h1>Cadastro de Aluno</h1>

        <form>

            <fieldset>
                <legend>DADOS PESSOAIS</legend>

                <div class="linha1">
                    <label>
                        Nome Completo:
                        <input type="text">
                    </label>

                    <label>
                        Sexo:
                        <select>
                            <option>Masculino</option>
                            <option>Feminino</option>
                            <option>Outros</option>
                        </select>
                    </label>
                </div>

                <div class="linha2">
                    <label>
                        Data de Nascimento:
                        <input type="date">
                    </label>

                    <label>
                        CPF:
                        <input type="text">
                    </label>

                    <label>
                        RG:
                        <input type="text">
                    </label>

                    <label>
                        Nacionalidade:
                        <input type="text">
                    </label>
                </div>

                <div class="linha3">
                    <label>
                        Email:
                        <input type="email">
                    </label>

                    <label>
                        Telefone Celular:
                        <input type="tel">
                    </label>

                    <label>
                        Telefone Residencial:
                        <input type="tel">
                    </label>
                </div>

            </fieldset>


            <fieldset>

                <legend>DADOS DE ENDEREÇO</legend>

                <div class="linha4">

                    <label>
                        CEP:
                        <input type="text">
                    </label>

                    <label>
                        Logradouro:
                        <input type="text">
                    </label>

                    <label>
                        Número:
                        <input type="number">
                    </label>

                    <label>
                        Complemento:
                        <input type="text">
                    </label>

                </div>

                <div class="linha5">

                    <label>
                        Bairro:
                        <input type="text">
                    </label>

                    <label>
                        Cidade:
                        <input type="text">
                    </label>

                    <label>
                        Estado:
                        <select>
                            <option>PR</option>
                            <option>SP</option>
                            <option>SC</option>
                            <option>RS</option>
                            <option>RJ</option>
                        </select>
                    </label>

                </div>

            </fieldset>


            <fieldset>

                <legend>DADOS ACADÊMICOS</legend>

                <div class="linha6">

                    <label>
                        Curso:
                        <input type="text">
                    </label>

                    <label>
                        Matrícula (RA):
                        <input type="number">
                    </label>

                    <label>
                        Ano/Semestre de Ingresso:
                        <input type="text">
                    </label>

                </div>

                <div class="linha7">

                    <label>
                        Modalidade:
                        <select>
                            <option>Presencial</option>
                            <option>Online</option>
                        </select>
                    </label>

                    <label>
                        Turno:
                        <select>
                            <option>Manhã</option>
                            <option>Tarde</option>
                            <option>Noite</option>
                        </select>
                    </label>

                    <label>
                        Escolaridade Anterior:
                        <input type="text">
                    </label>

                </div>

            </fieldset>


            <fieldset>

                <legend>DADOS DO RESPONSÁVEL</legend>

                <div class="linha8">

                    <label>
                        Nome do Responsável:
                        <input type="text">
                    </label>

                    <label>
                        CPF do Responsável:
                        <input type="text">
                    </label>

                </div>

                <div class="linha9">

                    <label style="width: 100%;">
                        Observações:
                        <textarea></textarea>
                    </label>

                </div>

            </fieldset>


            <div class="botoes">

                <button type="submit">Cadastrar</button>

                <button type="reset">Limpar</button>

            </div>

        </form>

    </div>

</body>

</html>
